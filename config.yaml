# All values can be overridden with environment variables / .env
# (upper-case name, e.g. MODEL, ADMIN_IDS, BOT_ALIASES).

# Telegram user IDs of admins (comma separated). Only admins can change the model.
admin_ids: ""

# Allowed USER Ids
allowed_user_ids: ""

# Budget configuration (USD). user_budget <= 0 means unlimited for allowed users,
# guest_budget <= 0 disables guests.
user_budget: 1
guest_budget: 0.5
# Budget period: daily, monthly, total
budget_period: monthly
# Language of the bot, supported: EN, RU (env: BOT_LANG)
lang: EN

# Minimum role to show stats. Supported values: ADMIN, USER, GUEST
stats_min_role: ADMIN

# Short names the bot reacts to in group chats, in addition to @username
# mentions, replies and commands. Example: ["пирдун", "бот"]
bot_aliases: []

# Models offered as buttons by /set_model (the admin can also type any id).
model_presets:
  - deepseek/deepseek-chat-v3-0324:free
  - openai/gpt-4o-mini

# Model configuration
type: openrouter
model: openai/gpt-4o-mini
base_url: https://openrouter.ai/api/v1
temperature: 0.7
top_p: 0.7
# Seconds to wait for the model
request_timeout: 300

# Directory for usage statistics and the model selected from Telegram.
# Mount it as a volume to keep data between restarts.
data_dir: logs

# How many characters of user messages are written to the log, for privacy
# (0 = don't log the text at all, -1 = log everything)
log_text_length: 20

# Assistant configuration
assistant_prompt: |
  • Read the entire convo history line by line before answering. You are Assistant.

# Vision settings
vision: true
vision_prompt: Describe the image
vision_detail: low
